name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source GitHub Actions cache; the default 'enhanced' provider has its own commercial terms.
          cache-provider: basic
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            mkdir -p app/signing
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/signing/tbc2wallet.keystore
          else
            echo "::warning::SIGNING_KEYSTORE_B64 is not set; this APK won't install over builds signed with the shared key."
          fi
      - name: Build and test
        run: ./gradlew assembleDebug test
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
